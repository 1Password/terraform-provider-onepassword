name: E2E Tests

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: true
        type: string
    secrets:
      OP_CONNECT_CREDENTIALS:
        description: "1Password Connect credentials"
        required: true
      OP_CONNECT_TOKEN:
        description: "1Password Connect token"
        required: true
      OP_SERVICE_ACCOUNT_TOKEN:
        description: "1Password service account token"
        required: true

permissions:
  contents: read

jobs:
  e2e-test-connect:
    name: E2E Tests (Connect)
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Install kubectl
        uses: step-security/setup-kubectl@b256bc71248a59f1e3a278fc75a65646d6a8a1c4 # v5.1.0

      - name: Install dependencies
        run: go mod tidy

      - name: Create '1password-credentials.json' file
        env:
          OP_CONNECT_CREDENTIALS: ${{ secrets.OP_CONNECT_CREDENTIALS }}
        run: |
          echo "$OP_CONNECT_CREDENTIALS" > 1password-credentials.json

      - name: Deploy Connect using Helm
        run: |
          helm repo add 1password https://1password.github.io/connect-helm-charts || true
          helm repo update
          helm install connect 1password/connect \
            --set connect.create=true \
            --set-file connect.credentials=1password-credentials.json \
            --set operator.create=false \
            --set operator.authMethod=connect \
            --set connect.api.env.OP_SYNC_TIMEOUT=1m

      - name: Wait for Connect service to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=onepassword-connect --timeout=300s || true
          kubectl get svc onepassword-connect

      - name: Run E2E tests
        run: |
          # Expose Connect from cluster
          kubectl port-forward svc/onepassword-connect 8080:8080 &
          PF_PID=$!

          # Run tests
          make test-e2e-connect

          # Cleanup: kill port-forward when done
          kill $PF_PID || true
        env:
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
          OP_CONNECT_HOST: http://localhost:8080

  e2e-test-service-account:
    name: E2E Tests (Service Account)
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Install dependencies
        run: go mod tidy

      - name: Run E2E tests (Service Account)
        run: make test-e2e-service-account
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
