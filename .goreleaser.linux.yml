version: 2
builds:
  - env:
      # Build statically so the provider runs on musl-based images such as Alpine.
      # This disables the onepassword-sdk-go desktop app integration on Linux.
      - CGO_ENABLED=0
      - GOPRIVATE="github.com/1Password"
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.commit={{.Commit}} -X version.ProviderVersion={{.Version}}"
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}"
archives:
  - formats: ["zip"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
# Checksums are generated in the final generate-checksums job to include all platforms
checksum:
  disable: true
signs: []
release:
  # Manifest.json is uploaded by the final generate-checksums job
  # If you want to manually examine the release before its live, uncomment this line:
  draft: true
changelog:
  disable: true
